<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Configurateur DA Kalimera</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --lagoon:#00C2D4; --lagoon-deep:#008C9E; --sea:#0B5E78; --sky:#BDEDF5; --night:#07374A;
    --sun:#FFC83D; --terracotta:#ED7A5C; --olive:#7C9A53;
    --foam:#F6FBFC; --sand:#FFF3D6; --ink:#0B3954; --muted:#5C7886; --ok:#14B86B;
  }
  * { box-sizing: border-box; }
  body { background: var(--foam); color: var(--ink); font-family: "Baloo 2", sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .geist { font-family: Geist, sans-serif; }
  header { padding: 22px 36px 0; display: flex; justify-content: space-between; align-items: center; }
  .prog { font-size: 13px; color: var(--muted); font-weight: 700; }
  .bar { height: 8px; background: #E2EEF1; border-radius: 999px; margin: 12px 36px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--lagoon); border-radius: 999px; transition: width .3s; }
  main { flex: 1; padding: 26px 36px 30px; max-width: 1180px; margin: 0 auto; width: 100%; }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 6px; }
  p.note { font-family: Geist; font-size: 14px; color: var(--muted); margin: 0 0 22px; max-width: 720px; line-height: 1.5; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .opt { background: #fff; border: 3px solid transparent; border-radius: 24px; overflow: hidden; cursor: pointer; box-shadow: 0 10px 28px rgba(11,94,120,.10); transition: transform .12s, border-color .12s; }
  .opt:hover { transform: translateY(-3px); }
  .opt.sel { border-color: var(--lagoon); box-shadow: 0 14px 36px rgba(0,194,212,.3); }
  .opt .pv { height: 200px; overflow: hidden; position: relative; }
  .opt .meta { padding: 13px 18px 15px; display: flex; gap: 10px; align-items: baseline; }
  .opt .k { background: var(--ink); color: #fff; border-radius: 8px; font-size: 12px; font-weight: 800; padding: 2px 8px; }
  .opt.sel .k { background: var(--lagoon); color: var(--night); }
  .opt .t { font-weight: 700; font-size: 16px; }
  .opt .d { font-family: Geist; font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
  footer { padding: 18px 36px 26px; display: flex; justify-content: space-between; align-items: center; }
  button { font-family: "Baloo 2"; font-weight: 700; font-size: 15px; border: none; border-radius: 999px; padding: 13px 26px; cursor: pointer; }
  .next { background: var(--ink); color: #fff; }
  .next:disabled { opacity: .35; cursor: default; }
  .prev { background: #fff; color: var(--muted); box-shadow: 0 6px 16px rgba(11,94,120,.10); }
  .skip { background: transparent; color: var(--muted); font-size: 13px; }

  /* écran final */
  .final { background: #fff; border-radius: 26px; padding: 28px 32px; box-shadow: 0 14px 36px rgba(11,94,120,.12); }
  .final h2 { margin: 0 0 14px; font-size: 24px; }
  textarea { width: 100%; height: 280px; font-family: Geist Mono, monospace; font-size: 13px; border: 2px solid #E2EEF1; border-radius: 16px; padding: 16px; resize: vertical; }
  .copy { background: var(--lagoon); color: var(--night); margin-top: 12px; }
  .copy.done { background: var(--ok); color: #fff; }

  /* ── previews ── */
  .pv-pad { padding: 16px; height: 100%; }
  .pv .mini-h1 { font-weight: 800; font-size: 22px; line-height: 1.1; }
  .pv .hl { color: #fff; text-shadow: 0 1px 8px rgba(11,94,120,.35); }
  .pv-grad { background: linear-gradient(175deg, var(--sky), #8FE0EC 45%, var(--lagoon)); }
  .pv-foam { background: var(--foam); }
  .pv .chip { display: inline-block; background: #fff; border-radius: 11px; padding: 6px 10px; font-size: 11px; font-weight: 700; box-shadow: 0 5px 13px rgba(11,94,120,.15); margin: 8px 6px 0 0; }
  .pv .chip.ink { background: var(--ink); color: #fff; }
  .pv .blob { position: absolute; border-radius: 50%; }
  .pv .greet { display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,.75); border-radius: 999px; padding: 5px 10px; font-size: 10px; font-weight: 700; color: var(--sea); margin-bottom: 8px; }
  .pv .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .pv .btn { display: inline-block; border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 800; }
  .pv table { font-size: 11px; border-collapse: collapse; width: 100%; }
  .pv .brd { background: var(--night); color: #EAF7FA; border-radius: 16px; padding: 11px 14px; font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pv .brd b { font-size: 17px; }
  .pv .st { font-size: 9.5px; font-weight: 800; border-radius: 999px; padding: 4px 8px; background: rgba(20,184,107,.18); color: #43E89D; white-space: nowrap; }
  .pv .wt { border-radius: 16px; padding: 10px 12px; display: inline-block; width: 46%; margin-right: 3%; vertical-align: top; }
  .pv .wt .c { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sea); }
  .pv .wt .dg { font-size: 26px; font-weight: 800; }
  .pv .nl { border-radius: 16px; padding: 12px 14px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .pv .nl .inp { background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 10px; color: var(--muted); font-family: Geist; }
</style>
</head>

const prog = document.getElementById("prog");
const bar = document.getElementById("bar");
const btnNext = document.getElementById("next");

const btnSkip = document.getElementById("skip");

function render() {
  if (idx >= QUESTIONS.length) return renderFinal();
  const q = QUESTIONS[idx];
  prog.textContent = (idx + 1) + " / " + QUESTIONS.length;
  bar.style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  main.innerHTML = `<h1>${q.titre}</h1><p class="note">${q.note}</p>
    <div class="opts">` + q.options.map(o => `
      <div class="opt ${answers[q.id] === o.k ? "sel" : ""}" data-k="${o.k}">
        <div class="pv">${o.pv}</div>
        <div class="meta"><span class="k">${o.k}</span><span><span class="t">${o.t}</span><span class="d">${o.d}</span></span></div>
      </div>`).join("") + `</div>`;
  main.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    answers[q.id] = el.dataset.k;
    main.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    el.classList.add("sel");
    btnNext.disabled = false;
  });
  btnNext.disabled = !answers[q.id];
  btnPrev.style.visibility = idx === 0 ? "hidden" : "visible";
  btnNext.textContent = idx === QUESTIONS.length - 1 ? "Terminer →" : "Suivant →";
  btnSkip.style.display = "";
}

function renderFinal() {
  prog.textContent = "Terminé";
  bar.style.width = "100%";
  btnNext.style.display = "none";
  btnSkip.style.display = "none";
  btnPrev.style.visibility = "visible";
  const lines = QUESTIONS.map(q => {
    const a = answers[q.id];
    const o = a ? q.options.find(o => o.k === a) : null;
    return `${q.titre.replace(/^\d+\. /, "")} : ${o ? o.k + " · " + o.t : "PASSÉ (à décider)"}`;
  });
  const txt = "MES CHOIX DA KALIMERA (wizard " + new Date().toLocaleDateString("fr") + ")\n" + lines.map(l => "- " + l).join("\n");
  main.innerHTML = `<div class="final"><h2>🎉 C'est tout bon · copie-colle ça à Claude :</h2>
    <textarea id="out" readonly>${txt}</textarea>
    <button class="copy" id="copy">📋 Copier mes réponses</button></div>`;
  document.getElementById("copy").onclick = async () => {
    const out = document.getElementById("out");
    out.select();
    try { await navigator.clipboard.writeText(out.value); } catch { document.execCommand("copy"); }
    const b = document.getElementById("copy");
    b.textContent = "✓ Copié !"; b.classList.add("done");
  };
}

btnNext.onclick = () => { idx++; render(); };
btnPrev.onclick = () => { if (idx > 0) { idx--; if (btnNext.style.display === "none") { btnNext.style.display = ""; } render(); } };
btnSkip.onclick = () => { delete answers[QUESTIONS[idx].id]; idx++; render(); };
render();
</script>
</body>
</html>
