name: checks

# Vérifs déterministes (pures, sans secret/DB) avant intégration : assertions
# node des libs + typecheck. Complète le build Vercel (qui couvre next build).
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
